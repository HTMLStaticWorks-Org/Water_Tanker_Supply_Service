<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Signup & Registration | AquaVanguard</title>
  <meta name="description" content="Register an AquaVanguard account to book water tankers instantly, access discounted community rates, and track deliveries.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%230284c7'/%3E%3Cstop offset='50%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%2314b8a6'/%3E%3C/linearGradient%3E%3Cstyle%3E.b%7Bfill:%23ffffff%7D@media(prefers-color-scheme:dark)%7B.b%7Bfill:%230b1329%7D%7D%3C/style%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='2' y='2' width='28' height='28' rx='6.5' class='b'/%3E%3Cg transform='translate(4,4)' fill='none' stroke='%230ea5e9' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z'/%3E%3Cpath d='M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.97'/%3E%3C/g%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
            navy: {
              800: '#0b1d3a',
              900: '#07152d',
              950: '#040b18',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-gradient-to-br from-slate-50 via-sky-50/50 to-slate-100 dark:from-navy-950 dark:via-slate-900 dark:to-navy-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 antialiased selection:bg-sky-500 selection:text-white">

  <!-- Top Utilities Bar (Theme & RTL Controls) -->
  <div class="max-w-6xl w-full mx-auto flex items-center justify-end py-2">
    <!-- Theme & RTL Controls -->
    <div class="flex items-center gap-3">
      <button class="theme-toggle-btn p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-200 hover:text-sky-600 shadow-sm transition" title="Toggle Light/Dark Theme">
        <i data-lucide="sun" class="w-4 h-4 theme-sun-icon hidden"></i>
        <i data-lucide="moon" class="w-4 h-4 theme-moon-icon"></i>
      </button>
      <button class="rtl-toggle-btn p-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-200 hover:text-sky-600 shadow-sm transition" title="Toggle RTL / LTR Direction" aria-label="Toggle Direction">
        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Center Registration Card -->
  <div class="flex-1 flex items-center justify-center my-8">
    <div class="w-full max-w-md p-8 sm:p-10 rounded-3xl bg-white/95 dark:bg-navy-900/95 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 shadow-2xl relative">
      
      <!-- Subtle top water gradient accent -->
      <div class="absolute -top-[1px] left-10 right-10 h-1 bg-gradient-to-r from-sky-500 via-cyan-400 to-teal-400 rounded-full"></div>

      <!-- Centered Logo & Brand Identity inside the Card -->
      <div class="flex flex-col items-center justify-center mb-6 pt-2">
        <a href="index.html" class="flex items-center gap-3 group text-center" title="AquaVanguard - Back to Home">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-gradient-to-tr from-sky-600 via-cyan-500 to-teal-400 p-0.5 shadow-md shadow-sky-500/20 group-hover:scale-105 transition-transform flex items-center justify-center">
            <div class="w-full h-full bg-white dark:bg-navy-900 rounded-[10px] flex items-center justify-center">
              <i data-lucide="droplets" class="w-5 h-5 sm:w-6 sm:h-6 text-sky-500"></i>
            </div>
          </div>
          <div class="text-left whitespace-nowrap">
            <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white font-heading block leading-none">
              Aqua<span class="text-sky-500">Vanguard</span>
            </span>
            <span class="text-[10px] uppercase font-bold tracking-widest text-slate-400 dark:text-slate-400">Tanker Logistics</span>
          </div>
        </a>
      </div>

      <div class="text-center mb-6">
        <h1 class="text-xl sm:text-2xl font-extrabold font-heading text-slate-900 dark:text-white">Create Account</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Join AquaVanguard for priority tanker dispatch & credit invoicing</p>
      </div>

      <!-- Signup Form -->
      <form id="signup-form" class="space-y-3.5">
        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">First Name *</label>
          <input type="text" id="reg-fname" required placeholder="Alex" class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Last Name *</label>
          <input type="text" id="reg-lname" required placeholder="Sterling" class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Email Address *</label>
          <input type="email" id="reg-email" required placeholder="alex@example.com" class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Mobile Number *</label>
          <input type="tel" id="reg-phone" required placeholder="+1 (555) 428-1122" class="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Password *</label>
          <div class="relative">
            <input type="password" id="reg-password" required placeholder="••••••••" class="w-full px-3.5 pr-10 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <button type="button" class="toggle-pass-btn absolute right-2 top-2 p-1 rounded-lg text-slate-400 hover:text-sky-600 dark:hover:text-sky-400 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-colors" data-target="reg-password" aria-label="Toggle password visibility" title="Show/Hide Password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Confirm Password *</label>
          <div class="relative">
            <input type="password" id="reg-cpassword" required placeholder="••••••••" class="w-full px-3.5 pr-10 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            <button type="button" class="toggle-pass-btn absolute right-2 top-2 p-1 rounded-lg text-slate-400 hover:text-sky-600 dark:hover:text-sky-400 hover:bg-slate-100 dark:hover:bg-slate-700/60 transition-colors" data-target="reg-cpassword" aria-label="Toggle confirm password visibility" title="Show/Hide Password">
              <i data-lucide="eye" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div class="pt-1">
          <label class="flex items-start gap-2 cursor-pointer text-xs text-slate-600 dark:text-slate-400">
            <input type="checkbox" required class="w-4 h-4 rounded text-sky-600 focus:ring-sky-500 mt-0.5">
            <span>I agree to the <a href="#" class="text-sky-600 dark:text-sky-400 font-semibold underline">Terms of Service</a> & <a href="#" class="text-sky-600 dark:text-sky-400 font-semibold underline">Water Quality Privacy Policy</a>.</span>
          </label>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-600 to-cyan-600 hover:from-sky-500 hover:to-cyan-500 text-white font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-sky-600/25">
          Create Account
        </button>
      </form>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
        <span class="mx-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider shrink-0">or sign up with</span>
        <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
      </div>

      <!-- Social Logins (Icon Only: Google, Facebook, Apple) -->
      <div class="flex items-center justify-center gap-4">
        <!-- Google -->
        <button type="button" onclick="handleSocialAuth('Google')" aria-label="Sign up with Google" title="Sign up with Google" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 hover:bg-white dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 flex items-center justify-center transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg hover:shadow-slate-300/40 dark:hover:shadow-black/40 group">
          <svg class="w-5 h-5 transition-transform group-hover:scale-110" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>

        <!-- Facebook -->
        <button type="button" onclick="handleSocialAuth('Facebook')" aria-label="Sign up with Facebook" title="Sign up with Facebook" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-[#1877F2] hover:bg-[#1877F2] text-[#1877F2] hover:text-white flex items-center justify-center transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg hover:shadow-[#1877F2]/30 group">
          <svg class="w-5 h-5 fill-current transition-transform group-hover:scale-110" viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>

        <!-- Apple -->
        <button type="button" onclick="handleSocialAuth('Apple')" aria-label="Sign up with Apple" title="Sign up with Apple" class="w-12 h-12 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-black dark:hover:border-white hover:bg-black dark:hover:bg-white text-slate-800 dark:text-slate-100 hover:text-white dark:hover:text-black flex items-center justify-center transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg hover:shadow-black/25 dark:hover:shadow-white/20 group">
          <svg class="w-5 h-5 fill-current transition-transform group-hover:scale-110" viewBox="0 0 170 170">
            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.69-7.74-11.99-14.09-6.3-9.27-11.22-20.17-14.75-32.69-3.53-12.52-5.3-24.16-5.3-34.92 0-14.15 3.37-25.79 10.12-34.92 6.74-9.13 15.22-13.8 25.43-14.02 4.35 0 9.28 1.16 14.79 3.49 5.51 2.33 9.4 3.55 11.66 3.67 1.63 0 5.76-1.27 12.38-3.8 6.62-2.54 12.28-3.62 16.99-3.23 12.83.65 22.92 5.34 30.27 14.07-11.09 6.74-16.52 16.09-16.3 28.05.22 9.57 3.86 17.61 10.92 24.13 7.07 6.52 15.44 10.22 25.12 11.1-2.17 6.53-4.89 13.15-8.16 19.86zm-31.95-103.54c0-7.39 2.61-14.24 7.83-20.55 5.22-6.31 11.63-10.33 19.24-12.06.22 1.3.33 2.39.33 3.26 0 7.39-2.72 14.35-8.16 20.88-5.44 6.53-12.07 10.33-19.89 11.41-.22-.98-.35-1.96-.35-2.94z"/>
          </svg>
        </button>
      </div>

      <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">
        Already have an account? 
        <a href="login.html" class="text-sky-600 dark:text-sky-400 font-bold hover:underline">Sign In</a>
      </p>

    </div>
  </div>



  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle Password Visibility independently for each field with eye / eye-off swap
      document.querySelectorAll('.toggle-pass-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (input) {
            const isPassword = input.getAttribute('type') === 'password';
            input.setAttribute('type', isPassword ? 'text' : 'password');
            btn.innerHTML = isPassword 
              ? '<i data-lucide="eye-off" class="w-4 h-4"></i>' 
              : '<i data-lucide="eye" class="w-4 h-4"></i>';
            if (window.lucide) {
              lucide.createIcons();
            }
          }
        });
      });

      // Handle Signup Form
      const form = document.getElementById('signup-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const p1 = document.getElementById('reg-password').value;
          const p2 = document.getElementById('reg-cpassword').value;
          if (p1 !== p2) {
            alert('Passwords do not match! Please check and try again.');
            return;
          }
          showToast('Account created successfully! Welcome to AquaVanguard Portal.', 'success');
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        });
      }
    });

    function handleSocialAuth(provider) {
      showToast(`Signed up via ${provider}! Redirecting to Dashboard...`, 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }
  </script>
</body>
</html>
